<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osciva AI Platform</title>
    <meta name="description" content="Build Your Own Smart AI Assistant — No Code Needed" />
    <meta name="author" content="Osciva AI" />

    <meta property="og:title" content="Osciva AI Platform" />
    <meta property="og:description" content="Build Your Own Smart AI Assistant — No Code Needed" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OscivaAI" />
    <!-- Splash intro + navbar logo: fetch before React mounts so the intro's
         first frame already has the mark. -->
    <link rel="preload" as="image" href="https://osciva.io/images/osciva-web.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before paint to avoid a flash. Light is the
      // default everywhere; marketing + app both honor the saved choice.
      // Auth pages always render light (they use useForceLightTheme).
      try {
        var forcedLight = /^\/(auth|reset-password)/.test(window.location.pathname);
        if (!forcedLight && localStorage.getItem('osciva-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
